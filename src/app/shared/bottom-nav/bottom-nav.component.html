<nav class="bottom-nav" aria-label="Navegación principal">
  <!-- Home -->
  <a
    class="bottom-nav__item"
    [routerLink]="['/']"
    routerLinkActive="bottom-nav__item--active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <svg
      class="bottom-nav__icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    >
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
      <polyline points="9 22 9 12 15 12 15 22" />
    </svg>
    <span class="bottom-nav__label">Inicio</span>
  </a>

  <!-- Catalogue -->
  <a
    class="bottom-nav__item"
    [routerLink]="['/' + routes.CATALOGUE]"
    routerLinkActive="bottom-nav__item--active"
  >
    <svg
      class="bottom-nav__icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    >
      <circle cx="12" cy="12" r="10" />
      <circle cx="12" cy="10" r="3" />
      <path d="M7 20.662V19a2 2 0 012-2h6a2 2 0 012 2v1.662" />
    </svg>
    <span class="bottom-nav__label">Colección</span>
  </a>

  <!-- Cart -->
  <a
    class="bottom-nav__item"
    [routerLink]="['/' + routes.CART]"
    routerLinkActive="bottom-nav__item--active"
  >
    <span class="bottom-nav__cart-wrapper">
      <svg
        class="bottom-nav__icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
        <line x1="3" y1="6" x2="21" y2="6" />
        <path d="M16 10a4 4 0 01-8 0" />
      </svg>
      @if (cartStore.itemCount() > 0) {
        <span class="bottom-nav__badge">{{ cartStore.itemCount() }}</span>
      }
    </span>
    <span class="bottom-nav__label">Carrito</span>
  </a>
</nav>
