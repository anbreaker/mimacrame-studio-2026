<article class="product-card" [routerLink]="['/producto', product().id]">
  <!-- Image -->
  <div class="product-card__image-wrapper">
    <img
      class="product-card__image"
      [src]="product().images[0] || 'assets/images/placeholder-product.jpg'"
      [alt]="product().name"
      loading="lazy"
    />

    <!-- Badges -->
    <div class="product-card__badges">
      @if (isOutOfStock) {
        <span class="product-card__badge product-card__badge--out">Agotado</span>
      } @else if (isLowStock) {
        <span class="product-card__badge product-card__badge--low">Últimas unidades</span>
      }
    </div>

    <!-- Quick add -->
    @if (!isOutOfStock) {
      <button
        class="product-card__quick-add"
        (click)="addToCart($event)"
        aria-label="Añadir al carrito"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          width="18"
          height="18"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
    }
  </div>

  <!-- Info -->
  <div class="product-card__info">
    <h3 class="product-card__name">{{ product().name }}</h3>
    <span class="product-card__price">
      {{ product().price | currency: 'EUR' : 'symbol' : '1.2-2' : 'es' }}
    </span>
  </div>
</article>
