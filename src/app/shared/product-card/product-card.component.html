<article
  class="product-card"
  [routerLink]="['/' + routes.PRODUCT, product().id]"
  *transloco="let t"
>
  <!-- Image -->
  <div class="product-card__image-wrapper">
    <img
      class="product-card__image"
      [src]="product().images[0] || 'assets/images/placeholder-product.jpg'"
      [alt]="localizedName()"
      loading="lazy"
    />

    <!-- Quick add (hidden for admin users) -->
    @if (!authStore.isAdmin()) {
      <button
        class="product-card__quick-add"
        (click)="addToCart($event)"
        [attr.aria-label]="t('productCard.quickAdd')"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          width="18"
          height="18"
        >
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <path d="M16 10a4 4 0 01-8 0" />
        </svg>
      </button>
    }
  </div>

  <!-- Info -->
  <div class="product-card__info">
    <h3 class="product-card__name">{{ localizedName() }}</h3>
    <span class="product-card__price">
      {{ product().price | currency: 'EUR' : 'symbol' : '1.2-2' : 'es' }}
    </span>
  </div>
</article>
