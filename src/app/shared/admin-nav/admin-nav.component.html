<nav class="admin-nav" *transloco="let t">
  <div class="admin-nav__logo">
    <span class="admin-nav__logo-text">Mimacramé</span>
    <span class="admin-nav__logo-sub">Admin</span>
  </div>

  <ul class="admin-nav__links">
    <li>
      <a
        class="admin-nav__link"
        [routerLink]="['/' + routes.ADMIN_DASHBOARD]"
        routerLinkActive="admin-nav__link--active"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          width="18"
          height="18"
        >
          <rect x="3" y="3" width="7" height="7" />
          <rect x="14" y="3" width="7" height="7" />
          <rect x="14" y="14" width="7" height="7" />
          <rect x="3" y="14" width="7" height="7" />
        </svg>
        {{ t('admin.nav.dashboard') }}
      </a>
    </li>
    <li>
      <a
        class="admin-nav__link"
        [routerLink]="['/' + routes.ADMIN_PRODUCTS]"
        routerLinkActive="admin-nav__link--active"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          width="18"
          height="18"
        >
          <circle cx="12" cy="12" r="10" />
          <circle cx="12" cy="10" r="3" />
          <path d="M7 20.662V19a2 2 0 012-2h6a2 2 0 012 2v1.662" />
        </svg>
        {{ t('admin.nav.products') }}
      </a>
    </li>
    <li>
      <a
        class="admin-nav__link"
        [routerLink]="['/' + routes.ADMIN_ORDERS]"
        routerLinkActive="admin-nav__link--active"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          width="18"
          height="18"
        >
          <path d="M21 10V8a2 2 0 00-2-2H5a2 2 0 00-2 2v2" />
          <rect x="1" y="10" width="22" height="12" rx="2" />
          <path d="M12 15v3M8 15v1M16 15v1" />
        </svg>
        {{ t('admin.nav.orders') }}
      </a>
    </li>
    <li>
      <a
        class="admin-nav__link"
        [routerLink]="['/' + routes.ADMIN_MATERIALS]"
        routerLinkActive="admin-nav__link--active"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          width="18"
          height="18"
        >
          <circle cx="12" cy="5" r="2" />
          <circle cx="5" cy="19" r="2" />
          <circle cx="19" cy="19" r="2" />
          <path d="M12 7v4M12 11l-5.5 6M12 11l5.5 6" />
        </svg>
        {{ t('admin.nav.materials') }}
      </a>
    </li>
    <li>
      <a
        class="admin-nav__link"
        [routerLink]="['/' + routes.ADMIN_POSTS]"
        routerLinkActive="admin-nav__link--active"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          width="18"
          height="18"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M3 9h18M9 21V9" />
        </svg>
        {{ t('admin.nav.posts') }}
      </a>
    </li>
  </ul>

  <div class="admin-nav__footer">
    <a class="admin-nav__footer-link" [routerLink]="['/']">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        width="16"
        height="16"
      >
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
      {{ t('admin.nav.backToStore') }}
    </a>
    <button class="admin-nav__logout" (click)="authStore.logout()" type="button">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        width="16"
        height="16"
      >
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      {{ t('admin.nav.logout') }}
    </button>
  </div>
</nav>
