<header class="navbar">
  <div class="navbar__inner" [class.navbar__inner--full]="isAdminRoute()">
    <!-- Left: Logo -->
    <a class="navbar__logo" [routerLink]="['/' + routes.HOME]">
      <span class="navbar__logo-texts" *transloco="let t">
        <span class="navbar__logo-text">Mimacramé</span>
        <span class="navbar__logo-sub">{{ t('shared.brandTagline') }}</span>
      </span>
      <img
        class="navbar__logo-img"
        src="/assets/images/logo-light.webp"
        alt=""
        aria-hidden="true"
      />
    </a>

    <!-- Center: Main Nav (Centered) -->
    <nav class="navbar__links" aria-label="Navegación principal" *transloco="let t">
      <a
        class="navbar__link"
        [routerLink]="['/' + routes.CATALOGUE]"
        routerLinkActive="navbar__link--active"
      >
        {{ t('navbar.collection') }}
      </a>
      <a
        class="navbar__link"
        [routerLink]="['/' + routes.MATERIALS]"
        routerLinkActive="navbar__link--active"
      >
        {{ t('navbar.materials') }}
      </a>
    </nav>

    <!-- Right: Actions -->
    <div class="navbar__actions" *transloco="let t">
      <app-lang-selector />

      <a
        class="navbar__action"
        [routerLink]="
          authStore.isAdmin()
            ? ['/' + routes.ADMIN]
            : authStore.isLoggedIn()
              ? ['/' + routes.ACCOUNT]
              : ['/' + routes.LOGIN]
        "
        [attr.aria-label]="authStore.isLoggedIn() ? t('navbar.account') : t('navbar.login')"
      >
        <svg
          class="navbar__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        @if (authStore.isLoggedIn() && !authStore.isAdmin()) {
          <span class="navbar__user-dot" aria-hidden="true"></span>
        }
        @if (authStore.isAdmin()) {
          <span class="navbar__role-badge" aria-hidden="true">Admin</span>
        }
      </a>

      @if (!authStore.isAdmin()) {
        <a
          class="navbar__action"
          [routerLink]="['/' + routes.CART]"
          [attr.aria-label]="t('navbar.cart')"
        >
          <svg
            class="navbar__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 01-8 0" />
          </svg>
          @if (cartStore.itemCount() > 0) {
            <span class="navbar__badge">{{ cartStore.itemCount() }}</span>
          }
        </a>
      }
    </div>
  </div>
</header>
