<footer class="footer" *transloco="let t; read: 'footer'">
  <div class="footer__inner">
    <!-- Brand -->
    <div class="footer__brand">
      <span class="footer__logo">Mimacramé</span>
      <p class="footer__tagline">{{ t('tagline') }}</p>
      <a
        class="footer__instagram"
        href="https://instagram.com"
        target="_blank"
        rel="noopener"
        [attr.aria-label]="t('instagram')"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          width="20"
          height="20"
        >
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none" />
        </svg>
        &#64;mimacrame.studio
      </a>
    </div>

    <!-- Links -->
    <nav class="footer__links" aria-label="Enlaces del pie de página">
      <a class="footer__link" routerLink="/catalogue">{{ t('links.collection') }}</a>
      <a class="footer__link" routerLink="/">{{ t('links.shipping') }}</a>
      <a class="footer__link" routerLink="/">{{ t('links.care') }}</a>
      <a class="footer__link" routerLink="/">{{ t('links.privacy') }}</a>
      <a class="footer__link" routerLink="/">{{ t('links.contact') }}</a>
    </nav>
  </div>

  <div class="footer__bottom">
    <p class="footer__copy">&copy; {{ currentYear }} {{ t('copy') }}</p>
  </div>
</footer>
