<div class="not-found" *transloco="let t">
  <div class="not-found__content">
    <span class="not-found__code">404</span>
    <h1 class="not-found__title">{{ t('notFound.title') }}</h1>
    <p class="not-found__subtitle">{{ t('notFound.subtitle') }}</p>
    <a class="not-found__cta" [routerLink]="['/' + routes.HOME]">{{ t('notFound.cta') }}</a>
  </div>
</div>
