<div class="confirmation" *transloco="let t; read: 'orderConfirmation'">
  @if (isSuccess()) {
    <!-- Success -->
    <div class="confirmation__card" *transloco="let ts; read: 'orderConfirmation.success'">
      <div class="confirmation__icon confirmation__icon--success" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          width="48"
          height="48"
        >
          <circle cx="12" cy="12" r="10" />
          <polyline points="9 12 11 14 15 10" />
        </svg>
      </div>
      <h1 class="confirmation__title">{{ ts('title') }}</h1>
      <p class="confirmation__subtitle">{{ ts('subtitle') }}</p>
      <p class="confirmation__order-ref">{{ orderRef }}</p>
      <p class="confirmation__message">{{ ts('message') }}</p>
      <a class="confirmation__cta" [routerLink]="['/' + routes.CATALOGUE]">{{ ts('cta') }}</a>
    </div>
  } @else {
    <!-- Error -->
    <div class="confirmation__card" *transloco="let te; read: 'orderConfirmation.error'">
      <div class="confirmation__icon confirmation__icon--error" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          width="48"
          height="48"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
      </div>
      <h1 class="confirmation__title">{{ te('title') }}</h1>
      <p class="confirmation__subtitle">{{ te('subtitle') }}</p>
      <a
        class="confirmation__cta confirmation__cta--outline"
        [routerLink]="['/' + routes.CHECKOUT]"
      >
        {{ te('cta') }}
      </a>
    </div>
  }
</div>
