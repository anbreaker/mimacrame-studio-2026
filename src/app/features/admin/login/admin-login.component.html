<div class="login">
  <div class="login__card">
    <!-- Logo -->
    <div class="login__logo">
      <span class="login__logo-text">Mimacramé</span>
      <span class="login__logo-sub">Studio · Admin</span>
    </div>

    <!-- Form -->
    <form class="login__form" (ngSubmit)="submit()" #f="ngForm">
      @if (authStore.error()) {
        <div class="login__error" role="alert">{{ authStore.error() }}</div>
      }

      <div class="login__field">
        <label class="login__label" for="email">Email</label>
        <input
          id="email"
          class="login__input"
          type="email"
          autocomplete="email"
          required
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          placeholder="admin@mimacrame.com"
        />
      </div>

      <div class="login__field">
        <label class="login__label" for="password">Contraseña</label>
        <input
          id="password"
          class="login__input"
          type="password"
          autocomplete="current-password"
          required
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          placeholder="••••••••"
        />
      </div>

      <button class="login__submit" type="submit" [disabled]="authStore.isLoading() || !f.valid">
        {{ authStore.isLoading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
