<app-login-form
  *transloco="let t"
  [subtitle]="t('adminLogin.subtitle')"
  [emailPlaceholder]="t('adminLogin.emailPlaceholder')"
  [error]="authStore.errorKey() ? t(authStore.errorKey()!) : null"
  [isLoading]="authStore.isLoading()"
  (emailSubmit)="login($event)"
  (googleSubmit)="authStore.loginWithGoogle()"
/>
