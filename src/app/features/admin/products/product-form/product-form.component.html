<div class="admin-layout" *transloco="let t; read: 'admin.productForm'">
  <app-admin-nav />
  <main class="admin-main">
    <div class="admin-main__inner">
      <div class="admin-page-header">
        <h1 class="admin-page-title">{{ isEditMode() ? t('editTitle') : t('newTitle') }}</h1>
        <a class="admin-btn admin-btn--outline" [routerLink]="['/' + routes.ADMIN_PRODUCTS]">
          {{ t('cancel') }}
        </a>
      </div>

      @if (error()) {
        <div class="admin-error">{{ error() }}</div>
      }

      <div class="product-form">
        <!-- Images -->
        <section class="form-section" *transloco="let ti; read: 'admin.productForm.images'">
          <h2 class="form-section__title">{{ ti('title') }}</h2>
          <p class="form-section__hint">
            {{ ti('hint') }}
          </p>

          <div class="image-grid">
            @for (img of images(); track $index) {
              <div class="image-thumb">
                <img [src]="img" alt="Imagen del producto" />
                <button
                  class="image-thumb__remove"
                  (click)="removeImage($index)"
                  type="button"
                  [attr.aria-label]="ti('remove')"
                >
                  ×
                </button>
              </div>
            }
            <label class="image-upload" [class.image-upload--loading]="isUploading()">
              @if (isUploading()) {
                <span>{{ ti('uploading') }}</span>
              } @else {
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  width="24"
                  height="24"
                >
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span>{{ ti('add') }}</span>
              }
              <input
                type="file"
                accept="image/*"
                (change)="onFileChange($event)"
                [disabled]="isUploading()"
                hidden
              />
            </label>
          </div>
        </section>

        <!-- Basic info -->
        <section class="form-section" *transloco="let tb; read: 'admin.productForm.basicInfo.fields'">
          <h2 class="form-section__title">{{ t('basicInfo.title') }}</h2>
          <div class="form-fields">
            <div class="form-field form-field--full">
              <label class="form-label">{{ tb('name') }}</label>
              <input
                class="form-input"
                type="text"
                [ngModel]="name()"
                (ngModelChange)="name.set($event)"
                name="name"
                [placeholder]="tb('namePlaceholder')"
              />
            </div>
            <div class="form-field form-field--full">
              <label class="form-label">{{ tb('description') }}</label>
              <textarea
                class="form-input form-input--textarea"
                rows="4"
                [ngModel]="description()"
                (ngModelChange)="description.set($event)"
                name="description"
                [placeholder]="tb('descriptionPlaceholder')"
              ></textarea>
            </div>
            <div class="form-field">
              <label class="form-label">{{ tb('price') }}</label>
              <input
                class="form-input"
                type="number"
                min="0"
                step="0.01"
                [ngModel]="price()"
                (ngModelChange)="price.set(+$event)"
                name="price"
              />
            </div>
            <div class="form-field">
              <label class="form-label">{{ tb('stock') }}</label>
              <input
                class="form-input"
                type="number"
                min="0"
                [ngModel]="stock()"
                (ngModelChange)="stock.set(+$event)"
                name="stock"
              />
            </div>
            <div class="form-field">
              <label class="form-label">{{ tb('category') }}</label>
              <select
                class="form-input"
                [ngModel]="category()"
                (ngModelChange)="category.set($event)"
                name="category"
              >
                @for (key of categoryKeys; track key) {
                  <option [value]="key">{{ categoryLabels()[key] }}</option>
                }
              </select>
            </div>
            <div class="form-field form-field--checkbox">
              <label class="form-label form-label--checkbox">
                <input
                  type="checkbox"
                  [ngModel]="active()"
                  (ngModelChange)="active.set($event)"
                  name="active"
                />
                {{ tb('active') }}
              </label>
            </div>
          </div>
        </section>

        <!-- Submit -->
        <div class="form-actions" *transloco="let ts; read: 'admin.productForm.submit'">
          <button
            class="admin-btn admin-btn--primary"
            type="button"
            (click)="save()"
            [disabled]="!isValid() || isSaving()"
          >
            {{ isSaving() ? ts('saving') : isEditMode() ? ts('save') : ts('create') }}
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
