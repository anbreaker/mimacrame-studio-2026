<section class="pedidos">
  <h2 class="pedidos__title">Mis pedidos</h2>

  @if (orders().length === 0) {
    <div class="pedidos__empty">
      <p class="pedidos__empty-text">Aún no tienes pedidos</p>
      <p class="pedidos__empty-hint">Cuando realices tu primera compra, aparecerá aquí.</p>
    </div>
  } @else {
    <ul class="pedidos__list">
      @for (order of orders(); track order.id) {
        <li class="pedidos__item">
          <span class="pedidos__item-id">#{{ order.id }}</span>
          <span class="pedidos__item-status">{{ order.status }}</span>
          <span class="pedidos__item-total">{{ order.total | number: '1.2-2' }} €</span>
        </li>
      }
    </ul>
  }
</section>
