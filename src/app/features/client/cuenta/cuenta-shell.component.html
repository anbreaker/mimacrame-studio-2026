<div class="cuenta">
  <!-- Sidebar -->
  <aside class="cuenta__sidebar">
    <div class="cuenta__avatar">
      <span class="cuenta__avatar-initial">{{ avatarInitial }}</span>
    </div>

    <div class="cuenta__user-info">
      @if (authStore.displayName()) {
        <p class="cuenta__user-name">{{ authStore.displayName() }}</p>
      }
      @if (authStore.user()?.email) {
        <p class="cuenta__user-email">{{ authStore.user()?.email }}</p>
      }
    </div>

    <nav class="cuenta__nav">
      <a
        class="cuenta__nav-link"
        routerLink="/account/profile"
        routerLinkActive="cuenta__nav-link--active"
      >
        Mi perfil
      </a>
      <a
        class="cuenta__nav-link"
        routerLink="/account/orders"
        routerLinkActive="cuenta__nav-link--active"
      >
        Mis pedidos
      </a>
    </nav>

    <button class="cuenta__logout" type="button" (click)="logout()">Cerrar sesión</button>
  </aside>

  <!-- Contenido principal -->
  <main class="cuenta__content">
    <router-outlet />
  </main>
</div>
