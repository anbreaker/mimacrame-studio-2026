<div class="account" [class.account--subpage]="isSubPage()" *transloco="let t">
  <!-- Sidebar / Main Menu -->
  <aside class="account__sidebar" [class.account__sidebar--hidden]="isSubPage()">
    <div class="account__avatar">
      <span class="account__avatar-initial">{{ avatarInitial }}</span>
    </div>

    <div class="account__user-info">
      @if (authStore.displayName()) {
        <p class="account__user-name">{{ authStore.displayName() }}</p>
      }
      @if (authStore.user()?.email) {
        <p class="account__user-email">{{ authStore.user()?.email }}</p>
      }
    </div>

    <nav class="account__nav">
      <a
        class="account__nav-link"
        routerLink="/account/profile"
        routerLinkActive="account__nav-link--active"
      >
        <span class="account__nav-icon">👤</span>
        {{ t('account.shell.myProfile') }}
      </a>
      <a
        class="account__nav-link"
        routerLink="/account/orders"
        routerLinkActive="account__nav-link--active"
      >
        <span class="account__nav-icon">📦</span>
        {{ t('account.shell.myOrders') }}
      </a>
    </nav>

    <button class="account__logout" type="button" (click)="logout()">
      <span class="account__nav-icon">🚪</span>
      {{ t('account.shell.logout') }}
    </button>
  </aside>

  <!-- Main content / Subpages -->
  <main class="account__content" [class.account__content--visible]="isSubPage()">
    @if (isSubPage()) {
      <a routerLink="/account" class="account__back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        {{ t('account.shell.back') }}
      </a>
    }
    <router-outlet />
  </main>
</div>
