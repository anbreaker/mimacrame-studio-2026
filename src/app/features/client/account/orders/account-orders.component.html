<section class="orders" *transloco="let t; read: 'account.orders'">
  <h2 class="orders__title">{{ t('title') }}</h2>

  @if (orders().length === 0) {
    <div class="orders__empty">
      <p class="orders__empty-text">{{ t('emptyMessage') }}</p>
      <p class="orders__empty-hint">{{ t('emptyHint') }}</p>
    </div>
  } @else {
    <ul class="orders__list">
      @for (order of orders(); track order.id) {
        <li class="orders__item">
          <span class="orders__item-id">#{{ order.id }}</span>
          <span class="orders__item-status">{{ order.status }}</span>
          <span class="orders__item-total">{{ order.total | currency: 'EUR' : 'symbol' : '1.2-2' : 'es' }}</span>
        </li>
      }
    </ul>
  }
</section>
