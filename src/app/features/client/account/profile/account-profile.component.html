<section class="profile" *transloco="let t; read: 'account.profile'">
  <h2 class="profile__title">{{ t('title') }}</h2>

  <div class="profile__avatar">
    <span class="profile__avatar-initial">{{ avatarInitial }}</span>
  </div>

  <dl class="profile__data">
    <div class="profile__data-row">
      <dt class="profile__data-label">{{ t('nameLabel') }}</dt>
      <dd class="profile__data-value">
        {{ authStore.displayName() ?? t('noName') }}
      </dd>
    </div>

    <div class="profile__data-row">
      <dt class="profile__data-label">{{ t('emailLabel') }}</dt>
      <dd class="profile__data-value">
        {{ authStore.user()?.email ?? '—' }}
      </dd>
    </div>
  </dl>
</section>
